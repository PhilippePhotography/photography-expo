
<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Philippe Verlinde | Fine Art Photography</title>

<meta name="description"
      content="Fine Art Photography van Philippe Verlinde. Ontdek bijzondere landschappen, verstilde momenten en fotografische verhalen.">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #ffffff;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 50px 30px;
}

/* HEADER */

.site-header {
    text-align: center;
    margin-bottom: 70px;
}

.site-header h1 {
    font-size: 42px;
    font-weight: 300;
    letter-spacing: 6px;
}

.site-subtitle {
    margin-top: 10px;
    color: #888;
    font-size: 14px;
    letter-spacing: 3px;
}

/* GALLERY */

.gallery {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(450px, 1fr));

    gap: 60px;
}

/* PHOTO CARD */

.card {
    text-decoration: none;
    color: #222;
    display: block;
}

.card img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    display: block;
    transition: 0.3s;
}

.card:hover img {
    transform: scale(1.02);
}

.card-title {
    text-align: center;
    margin-top: 18px;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 2px;
}

.card-meta {
    text-align: center;
    margin-top: 8px;
    color: #777;
    letter-spacing: 1px;
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 100px;
    color: #777;
    font-size: 12px;
    letter-spacing: 3px;
    line-height: 2;
}

/* RESPONSIVE */

@media (max-width: 768px) {

    .container {
        padding: 25px;
    }

    .gallery {
        grid-template-columns: 1fr;
        gap: 40px;
    }

    .site-header h1 {
        font-size: 28px;
    }

    .card img {
        height: 250px;
    }

    .card-title {
        font-size: 20px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header class="site-header">

        <h1>PHILIPPE VERLINDE</h1>

        <div class="site-subtitle">
            FINE ART PHOTOGRAPHY
        </div>

    </header>


    <!-- GALLERY -->

    <div id="gallery" class="gallery">

    </div>


    <!-- FOOTER -->

    <div class="footer">

        CAPTURED MOMENTS<br>
        LASTING STORIES

    </div>

</div>


<!-- JAVASCRIPT -->

<script>


const gallery = document.getElementById("gallery");

// Basisadres van je GitHub Pages website
const baseUrl = "/photography-expo/";

fetch(baseUrl + "data/gallery.json")

.then(response => {

    if (!response.ok) {
        throw new Error("gallery.json kon niet worden geladen");
    }

    return response.json();

})

.then(data => {

    gallery.innerHTML = "";

    data.forEach(photo => {

        // Bestandsnaam zonder extensie ophalen
        const photoName = photo.image
            .split("/")
            .pop()
            .replace(/\.[^.]+$/, "");

        // Dynamische URL samenstellen
        const detailUrl = baseUrl +
            "works/foto.html?photo=" +
            encodeURIComponent(photoName);

        console.log("Foto:", photo.title);
        console.log("Link:", detailUrl);

        // Kaart aanmaken
        const card = document.createElement("a");

        card.href = detailUrl;
        card.className = "card";

        // Afbeelding
        const image = document.createElement("img");

        image.src = baseUrl + photo.image;
        image.alt = photo.title;
        image.loading = "lazy";

        // Titel
        const title = document.createElement("div");

        title.className = "card-title";
        title.textContent = photo.title;

        // Locatie en jaar
        const meta = document.createElement("div");

        meta.className = "card-meta";

        meta.textContent =
            [photo.location, photo.year]
            .filter(Boolean)
            .join(" · ");

        // Alles samenvoegen
        card.appendChild(image);
        card.appendChild(title);
        card.appendChild(meta);

        gallery.appendChild(card);

    });

})

.catch(error => {

    console.error("Fout:", error);

    gallery.innerHTML =
        "<p>Fout bij het laden van de fotogalerij.</p>";

});

      
</script>

</body>

</html>
