<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fine Art Photography</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container">

<h1 id="titel"></h1>

<div id="meta"></div>

<img id="foto"
     style="width:100%;margin-top:25px;">

<div class="line"></div>

<div id="verhaal"></div>

<div class="audio-box">

    <h3>Luister naar het verhaal</h3>

    <audio controls id="audioPlayer">
    </audio>

</div>

<details>
    <summary>Technische gegevens</summary>

    <ul>
        <li>📷 <span id="camera"></span></li>
        <li>🔍 <span id="lens"></span></li>
        <li>⏱ <span id="sluitertijd"></span></li>
        <li>◉ <span id="diafragma"></span></li>
        <li>▭ ISO <span id="iso"></span></li>
    </ul>
</details>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const photoId = params.get("id");

fetch("../data/photos.json")
.then(response => response.json())
.then(data => {

    const photo = data.find(
        p => p.id === photoId
    );

    if(!photo){

        document.body.innerHTML =
        "<h1>Foto niet gevonden</h1>";

        return;
    }

    document.getElementById("titel")
        .textContent = photo.titel;

    document.getElementById("meta")
        .innerHTML =
        photo.locatie +
        "<br>" +
        photo.jaar;

    document.getElementById("foto")
        .src = photo.foto;

    document.getElementById("verhaal")
        .textContent = photo.verhaal;

    document.getElementById("camera")
        .textContent = photo.camera;

    document.getElementById("lens")
        .textContent = photo.lens;

    document.getElementById("sluitertijd")
        .textContent = photo.sluitertijd;

    document.getElementById("diafragma")
        .textContent = photo.diafragma;

    document.getElementById("iso")
        .textContent = photo.iso;

    document.getElementById("audioPlayer")
        .innerHTML =
        '<source src="' +
        photo.audio +
        '" type="audio/mpeg">';
});

</script>

</body>
</html>
